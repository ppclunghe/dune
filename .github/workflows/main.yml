name: Fetch Dune SQL Queries

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-dune-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # Uses PAT to allow pushing changes

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install jupyter nbconvert

      - name: Convert Notebook to Python
        run: jupyter nbconvert --to script queries_backup.ipynb
        
      - name: Run Python Script
        run: python queries_backup.py

      - name: Commit and Push Changes to a New Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git checkout -b update-dune-queries  # Create a new branch
          git add .
          git commit -m "Auto-update Dune SQL queries" || echo "No changes to commit"
          git push origin update-dune-queries  # Push to new branch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          branch: update-dune-queries
          title: "Auto-update Dune SQL queries"
          body: "Automated update of queries."
