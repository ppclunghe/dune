name: Fetch Dune SQL Queries

on:
  schedule:
    - cron: '0 * * * *' # '0 0 1 * *'  # Runs on the 1st day of every month at midnight UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-dune-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # Use PAT instead of GITHUB_TOKEN

      - name: Debug GH_PAT
        run: echo "GH_PAT is set"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          
      - name: Debug Authentication
        run: |
          git remote -v
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" https://api.github.com/user
        env:
          GH_PAT: ${{ secrets.GH_PAT }}    
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt  # If you have dependencies
          pip install jupyter nbconvert  # If using a notebook
          
      - name: Convert Notebook to Python
        run: jupyter nbconvert --to script queries_backup.ipynb
        
      - name: Run Python Script
        run: python queries_backup.py  # Execute your script
        
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "ppclunghe"  # Set your GitHub username
          git config --global user.email "pipistrella@list.ru"  # Use your GitHub email
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ppclunghe/dune.git
          git add .
          git commit -m "Auto-update Dune SQL queries" || echo "No changes to commit"
          git push origin initial-backup-MC
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      
