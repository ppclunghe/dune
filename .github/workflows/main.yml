name: Fetch Dune SQL Queries

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-dune-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0  # Fetch all history to access all branches

      - name: Debug Available Branches
        run: git branch -r  # List all remote branches for debugging

      - name: Detect Default Branch
        id: detect-branch
        run: |
          DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          echo "Default branch is: $DEFAULT_BRANCH"
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install jupyter nbconvert

      - name: Convert Notebook to Python
        run: jupyter nbconvert --to script queries_backup.ipynb
        
      - name: Run Python Script
        run: python queries_backup.py

      - name: Commit and Push Changes to a New Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          
          # Checkout the detected default branch
          git checkout ${{ env.DEFAULT_BRANCH }}

          # Create a unique branch name
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="update-dune-queries-${TIMESTAMP}"
          git checkout -b $BRANCH_NAME

          git add .
          git commit -m "Auto-update Dune SQL queries" || echo "No changes to commit"
          git push origin $BRANCH_NAME  # Push new branch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          branch: ${{ env.BRANCH_NAME }}
          base: ${{ env.DEFAULT_BRANCH }}
          title: "Auto-update Dune SQL queries"
          body: "Automated update of queries."
