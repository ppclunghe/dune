name: Fetch Dune SQL Queries

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs on the 1st of every month at midnight UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-dune-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0  # Fetch all history to access all branches

      - name: Detect Default Branch
        id: detect-branch
        run: |
          DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV
          echo "Default branch detected: $DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create .env file with Dune API Key
        run: echo "DUNE_API_KEY=${{ secrets.DUNE_API_KEY }}" > .env
        
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install jupyter nbconvert

      - name: Convert Notebook to Python
        run: jupyter nbconvert --to script queries_backup.ipynb

      - name: Run Python Script
        run: python queries_backup.py

      - name: Commit and Push Changes to a New Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"

          # Checkout the default branch
          git checkout ${{ env.DEFAULT_BRANCH }}

          # Create a unique branch name
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="update-dune-queries-${TIMESTAMP}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV  # Store branch name for later steps

          git checkout -b $BRANCH_NAME

          # Add and commit changes if there are any
          git add .
          if git diff --cached --quiet; then
            echo "No changes detected. Exiting..."
            exit 0  # Stop the workflow if no changes
          fi
          
          git commit -m "Auto-update Dune SQL queries"
          git push origin $BRANCH_NAME  # Push new branch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          branch: ${{ env.BRANCH_NAME }}
          base: ${{ env.DEFAULT_BRANCH }}
          title: "Auto-update Dune SQL queries"
          body: "Automated update of queries."
          delete-branch: true  # Auto-delete branch after merge

      - name: Auto-Merge PR (Optional)
        if: success()
        run: |
          PR_URL=$(gh pr list --base ${{ env.DEFAULT_BRANCH }} --head ${{ env.BRANCH_NAME }} --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            gh pr merge --auto --squash "$PR_URL"
            echo "Pull request merged: $PR_URL"
          else
            echo "No open pull request found for auto-merge."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
